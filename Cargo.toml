[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/pw-contracts",
    "crates/pw-domain",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
pw-contracts = { path = "crates/pw-contracts" }
pw-domain = { path = "crates/pw-domain" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-build = { version = "2.6.3", features = [] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
