[workspace]
resolver = "3"
members = ["crates/pw-domain"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
pw-domain = { path = "crates/pw-domain" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
