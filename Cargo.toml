[workspace]
members = ["crates/pw-contracts", "crates/pw-domain"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = "=12.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
