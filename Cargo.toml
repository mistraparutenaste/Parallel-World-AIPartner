[workspace]
members = ["apps/desktop/src-tauri", "crates/pw-contracts", "crates/pw-domain", "crates/pw-platform"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = "=12.0.1"
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
tauri-build = "=2.6.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
