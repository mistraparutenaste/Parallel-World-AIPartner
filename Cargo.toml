[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/pw-application",
    "crates/pw-audio",
    "crates/pw-contracts",
    "crates/pw-domain",
    "crates/pw-llm",
    "crates/pw-platform",
    "crates/pw-stt-sherpa",
    "crates/pw-storage",
    "crates/pw-tts",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
async-trait = "0.1"
cpal = "0.18.1"
command-group = "5.0.1"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
pw-application = { path = "crates/pw-application" }
pw-audio = { path = "crates/pw-audio" }
pw-contracts = { path = "crates/pw-contracts" }
pw-domain = { path = "crates/pw-domain" }
pw-llm = { path = "crates/pw-llm" }
pw-platform = { path = "crates/pw-platform" }
pw-stt-sherpa = { path = "crates/pw-stt-sherpa" }
pw-storage = { path = "crates/pw-storage" }
pw-tts = { path = "crates/pw-tts" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rusqlite = { version = "0.40.1", features = ["backup", "bundled", "modern_sqlite"] }
rtrb = "0.3.4"
# 4.0はaudioadapter前提のAPI刷新直後のため、実績のある0.16系を使用
rubato = "0.16"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
same-file = "1.0.6"
sherpa-onnx = "1.13.4"
tauri = { version = "2.11.5", features = ["macos-private-api", "protocol-asset"] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "=2.10.1"
tiny_http = "0.12"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
