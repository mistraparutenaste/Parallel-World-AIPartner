[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/pw-application",
    "crates/pw-audio",
    "crates/pw-contracts",
    "crates/pw-domain",
    "crates/pw-platform",
    "crates/pw-stt-sherpa",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
cpal = "0.18.1"
pw-application = { path = "crates/pw-application" }
pw-audio = { path = "crates/pw-audio" }
pw-contracts = { path = "crates/pw-contracts" }
pw-domain = { path = "crates/pw-domain" }
pw-platform = { path = "crates/pw-platform" }
pw-stt-sherpa = { path = "crates/pw-stt-sherpa" }
rtrb = "0.3.4"
# 4.0はaudioadapter前提のAPI刷新直後のため、実績のある0.16系を使用
rubato = "0.16"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sherpa-onnx = "1.13.4"
tauri = { version = "2.11.5", features = ["macos-private-api", "protocol-asset"] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-window-state = "2"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
