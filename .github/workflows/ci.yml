name: CI

# push / pull_request では windows のみを回して常時ゲートとする。
# ローカルで再現できないOSを追加で確認したいときは手動実行でOSを選ぶ。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: 検証するOS
        type: choice
        default: macos
        options: [macos, windows, both]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["windows-latest"]' || inputs.os == 'both' && '["windows-latest", "macos-latest"]' || inputs.os == 'windows' && '["windows-latest"]' || '["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # build first: desktop typecheck/test resolve @parallel-world/live2d-runtime from its dist
      - name: Frontend build
        run: pnpm build

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      # pw-contracts のテストは packages/contracts の生成物を再生成して
      # コミット済みの内容と差分比較する。再生成忘れをここで落とす。
      - name: Contract bindings drift
        run: cargo test -p pw-contracts

      - name: Distribution config
        run: pnpm distribution:verify
